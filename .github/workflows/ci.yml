name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: notes-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NOTES_TEST_OUTPUT: .output
    steps:
      - name: Checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --redact --no-banner
      - name: Setup Node v6
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check schema against committed migrations
        run: pnpm db:generate | grep -F 'No schema changes'
      - run: docker compose config --quiet
      - name: Setup Buildx v4
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Build image with layer cache v7
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-app
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose up --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/api/readyz
      - run: mkdir -p .output && docker compose cp app:/app/.output/. .output
      - name: Verify packaged assets and migrations
        run: |
          cmp src/public/notebook.svg .output/public/notebook.svg
          diff -r src/server/database/migrations .output/server/migrations
      - run: pnpm test
      - name: Cache Chromium v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser diagnostics v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: playwright
          path: .dev-artifacts/playwright/
          include-hidden-files: true
          if-no-files-found: ignore
      - run: docker compose down -v
        if: always()
  result:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
